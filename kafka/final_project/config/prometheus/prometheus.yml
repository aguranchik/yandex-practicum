global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: kafka-brokers
    static_configs:
      - targets:
          - primary-kafka-1:9404
          - primary-kafka-2:9404
          - primary-kafka-3:9404
        labels:
          cluster: primary
      - targets:
          - secondary-kafka-1:9404
          - secondary-kafka-2:9404
          - secondary-kafka-3:9404
        labels:
          cluster: secondary
