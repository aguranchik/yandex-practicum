route:
  receiver: default
  group_by:
    - alertname
    - cluster
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
